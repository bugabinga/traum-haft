[package]
name = "traum-haft-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "traum-haft worker: runs developer app containers, routes the worker's Caddy to them"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
traum-haft-common = { version = "0.1.0", path = "../common" }
