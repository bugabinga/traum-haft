[package]
name = "traum-haft-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "traum-haft platform MCP: OAuth 2.1 for Cowork, app tools, builds and deploys"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
html-escape = "0.2.15"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls", "http2", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
traum-haft-common = { version = "0.1.0", path = "../common" }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
