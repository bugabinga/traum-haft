[package]
name = "traum-haft-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared traum-haft clients: GitHub App, triage routine, email"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
p256 = { version = "0.14.0", features = ["pkcs8", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "signal", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
