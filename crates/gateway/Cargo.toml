[package]
name = "traum-haft-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "traum-haft gateway: app tokens, OIDC discovery, token-exchange checks, integrations"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
p256 = { version = "0.14.0", features = ["pkcs8", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
